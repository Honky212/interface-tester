config:
  name: _api_directory_create
  base_url: http://127.0.0.1:8899
teststeps:
- name: _api_directory_create
  request:
    method: POST
    url: /api/directory/create
    headers:
      Content-Type: application/json
    json:
      path: /app1/documents/reports/
  validate:
  - type_match:
    - body.success
    - bool
  - equal:
    - body.success
    - true
  - equal:
    - body.errorCode
    - null
  - type_match:
    - body.message
    - str
  - equal:
    - body.data
    - null
