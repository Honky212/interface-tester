{
  "petstore_demo_pets.yml": "# 由 `hconvert` 从 Petstore Demo 生成（InterfaceTester 导入器）\n# 用法：hrun petstore_demo_pets.yml\n# NOTICE:\n#   - 敏感信息（Cookie/Authorization/token 等）已替换成 ${...} 占位，\n#     占位符的值定义在 config.variables 里（默认从环境变量读）——**不要**把明文写回来；\n#   - 生成后请人工过一遍：契约/录制里造出来的骨架值（时间戳/UUID/路径 id/示例值）需要按业务替换；\n#   - 生成的 *_test.py 由 hmake 产出，改用例请改这个 YAML。\nconfig:\n  name: petstore_demo / pets\n  base_url: https://api.petstore.test/v1\n  variables:\n    AUTH_TOKEN: ${ENV(AUTH_TOKEN)}\n    API_KEY_X_API_KEY: ${ENV(API_KEY_X_API_KEY)}\n    petId: pet-001\n    petId_5: 0\nteststeps:\n- name: GET /pets — 查询宠物列表\n  request:\n    method: GET\n    url: /pets\n    params:\n      limit: 10\n      status: available\n    headers:\n      Authorization: Bearer ${AUTH_TOKEN}\n  validate:\n  - eq:\n    - status_code\n    - 200\n  - jsonschema_match:\n    - body\n    - schemas/pets_01_get_pets_查询宠物列表.json\n- name: POST /pets — 新建宠物\n  request:\n    method: POST\n    url: /pets\n    headers:\n      X-API-Key: ${API_KEY_X_API_KEY}\n    json:\n      name: 旺财\n      tag: dog\n      tags:\n      - cute\n      - small\n  validate:\n  - eq:\n    - status_code\n    - 201\n  - jsonschema_match:\n    - body\n    - schemas/pets_02_post_pets_新建宠物.json\n- name: GET /pets/{petId} — 查询单个宠物\n  request:\n    method: GET\n    url: /pets/${petId}\n    headers:\n      Authorization: Bearer ${AUTH_TOKEN}\n  validate:\n  - eq:\n    - status_code\n    - 200\n  - jsonschema_match:\n    - body\n    - schemas/pets_03_get_pets_petid_查询单个宠物.json\n- name: PATCH /pets/{petId} — 更新宠物（requestBody 无 example → 造骨架）\n  request:\n    method: PATCH\n    url: /pets/${petId}\n    headers:\n      Authorization: Bearer ${AUTH_TOKEN}\n    json:\n      name: string\n      status: available\n  validate:\n  - eq:\n    - status_code\n    - 200\n  - jsonschema_match:\n    - body\n    - schemas/pets_04_patch_pets_petid_更新宠物_requestbody_无_example_造骨架.json\n- name: DELETE /pets/{petId} — 删除宠物（路径参数无 example → 造值并告警）\n  request:\n    method: DELETE\n    url: /pets/${petId_5}\n    headers:\n      Authorization: Bearer ${AUTH_TOKEN}\n  validate:\n  - eq:\n    - status_code\n    - 204\n",
  "petstore_demo_store.yml": "# 由 `hconvert` 从 Petstore Demo 生成（InterfaceTester 导入器）\n# 用法：hrun petstore_demo_store.yml\n# NOTICE:\n#   - 敏感信息（Cookie/Authorization/token 等）已替换成 ${...} 占位，\n#     占位符的值定义在 config.variables 里（默认从环境变量读）——**不要**把明文写回来；\n#   - 生成后请人工过一遍：契约/录制里造出来的骨架值（时间戳/UUID/路径 id/示例值）需要按业务替换；\n#   - 生成的 *_test.py 由 hmake 产出，改用例请改这个 YAML。\nconfig:\n  name: petstore_demo / store\n  base_url: https://api.petstore.test/v1\n  variables:\n    AUTH_TOKEN: ${ENV(AUTH_TOKEN)}\nteststeps:\n- name: POST /store/orders — 下单（application/x-www-form-urlencoded）\n  request:\n    method: POST\n    url: /store/orders\n    headers:\n      Authorization: Bearer ${AUTH_TOKEN}\n    data:\n      petId: pet-001\n      quantity: 1\n  validate:\n  - eq:\n    - status_code\n    - 200\n  - jsonschema_match:\n    - body\n    - schemas/store_01_post_store_orders_下单_application_x-www-form-urlencoded.json\n",
  "schemas/pets_01_get_pets_查询宠物列表.json": "{\n  \"type\": \"array\",\n  \"items\": {\n    \"type\": \"object\",\n    \"required\": [\n      \"id\",\n      \"name\"\n    ],\n    \"properties\": {\n      \"id\": {\n        \"type\": \"integer\"\n      },\n      \"name\": {\n        \"type\": \"string\"\n      },\n      \"tag\": {\n        \"type\": \"string\"\n      },\n      \"tags\": {\n        \"type\": \"array\",\n        \"items\": {\n          \"type\": \"string\"\n        }\n      },\n      \"status\": {\n        \"type\": \"string\",\n        \"enum\": [\n          \"available\",\n          \"pending\",\n          \"sold\"\n        ]\n      }\n    }\n  }\n}\n",
  "schemas/pets_02_post_pets_新建宠物.json": "{\n  \"type\": \"object\",\n  \"required\": [\n    \"id\",\n    \"name\"\n  ],\n  \"properties\": {\n    \"id\": {\n      \"type\": \"integer\"\n    },\n    \"name\": {\n      \"type\": \"string\"\n    },\n    \"tag\": {\n      \"type\": \"string\"\n    },\n    \"tags\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"string\"\n      }\n    },\n    \"status\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"available\",\n        \"pending\",\n        \"sold\"\n      ]\n    }\n  }\n}\n",
  "schemas/pets_03_get_pets_petid_查询单个宠物.json": "{\n  \"oneOf\": [\n    {\n      \"type\": \"object\",\n      \"required\": [\n        \"id\",\n        \"name\"\n      ],\n      \"properties\": {\n        \"id\": {\n          \"type\": \"integer\"\n        },\n        \"name\": {\n          \"type\": \"string\"\n        },\n        \"tag\": {\n          \"type\": \"string\"\n        },\n        \"tags\": {\n          \"type\": \"array\",\n          \"items\": {\n            \"type\": \"string\"\n          }\n        },\n        \"status\": {\n          \"type\": \"string\",\n          \"enum\": [\n            \"available\",\n            \"pending\",\n            \"sold\"\n          ]\n        }\n      }\n    },\n    {\n      \"type\": \"object\",\n      \"required\": [\n        \"code\",\n        \"message\"\n      ],\n      \"properties\": {\n        \"code\": {\n          \"type\": \"integer\"\n        },\n        \"message\": {\n          \"type\": \"string\"\n        },\n        \"details\": {\n          \"type\": \"object\",\n          \"additionalProperties\": {\n            \"type\": \"string\"\n          }\n        }\n      }\n    }\n  ]\n}\n",
  "schemas/pets_04_patch_pets_petid_更新宠物_requestbody_无_example_造骨架.json": "{\n  \"type\": \"object\",\n  \"required\": [\n    \"id\",\n    \"name\"\n  ],\n  \"properties\": {\n    \"id\": {\n      \"type\": \"integer\"\n    },\n    \"name\": {\n      \"type\": \"string\"\n    },\n    \"tag\": {\n      \"type\": \"string\"\n    },\n    \"tags\": {\n      \"type\": \"array\",\n      \"items\": {\n        \"type\": \"string\"\n      }\n    },\n    \"status\": {\n      \"type\": \"string\",\n      \"enum\": [\n        \"available\",\n        \"pending\",\n        \"sold\"\n      ]\n    }\n  }\n}\n",
  "schemas/store_01_post_store_orders_下单_application_x-www-form-urlencoded.json": "{\n  \"type\": \"object\",\n  \"required\": [\n    \"orderId\",\n    \"status\"\n  ],\n  \"properties\": {\n    \"orderId\": {\n      \"type\": \"string\"\n    },\n    \"status\": {\n      \"type\": [\n        \"string\",\n        \"null\"\n      ]\n    }\n  }\n}\n"
}
