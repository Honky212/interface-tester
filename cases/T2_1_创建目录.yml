#   - 敏感信息（Cookie/Authorization/token 等）已替换成 ${...} 占位，
#     占位符的值定义在 config.variables 里（默认从环境变量读）——**不要**把明文写回来；
#   - 生成后请人工过一遍：契约/录制里造出来的骨架值（时间戳/UUID/路径 id/示例值）需要按业务替换；
#   - 生成的 *_test.py 由 hmake 产出，改用例请改这个 YAML。
config:
  name: T2_1_创建目录
  base_url: https://unifsptst.cernet.com
teststeps:
- name: 调用接口创建目录
  request:
    method: POST
    url: /api/directory/create
    headers:
      Content-Type: application/json
      Authorization: Bearer ${ENV(AUTH_HEADER)}
      X-Path: /app1/
    json:
      path: /app1/documents/reports/
  validate:
  - equal:
    - status_code
    - 200
