# ============================================================
# 登录 / 认证：显式调用 OAuth2 token 端点并断言
# 对应原用例：TC-AUTH-001（获取 Token - 正常流程）
# 运行：hrun examples/unifsp/auth_login.yml
# ============================================================
config:
    name: 登录 - 获取 access token
    base_url: ${api_base()}
    verify: false

teststeps:
  - name: 获取 access token
    request:
        url: /oauth2/token
        method: POST
        headers:
            Content-Type: application/x-www-form-urlencoded
        data:
            grant_type: client_credentials
            client_id: ${ENV(UNIFSP_CLIENT_ID)}
            client_secret: ${ENV(UNIFSP_CLIENT_SECRET)}
    extract:
        - token: body.access_token
    validate:
        - eq: [body.token_type, Bearer]
        - type_match: [body.access_token, str]
