# ============================================================
# 创建目录：OAuth2 自动认证 + X-Path 便捷支持
# 对应原用例：TC-DIR-001（创建单级目录）
# 运行：hrun examples/unifsp/directory_create.yml
# ============================================================
config:
    name: 创建目录
    base_url: ${api_base()}
    verify: false
    variables:
        app_path: ${app_path()}
        test_dir: ${test_dir()}
    oauth2:
        token_url: ${token_url()}
        client_id: ${ENV(UNIFSP_CLIENT_ID)}
        client_secret: ${ENV(UNIFSP_CLIENT_SECRET)}

teststeps:
  - name: 创建测试目录
    request:
        url: /api/directory/create
        method: POST
        x_path: $app_path          # X-Path 为父目录，新目录路径只需以其开头
        json:
            path: $test_dir        # 新目录完整路径，末尾带斜杠
    validate:
        - eq: [body.success, true]
        - eq: [body.errorCode, null]
