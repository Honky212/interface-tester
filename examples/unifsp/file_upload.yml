# ============================================================
# 上传文件：创建目录 + 上传（中文文件名，验证 UTF-8 multipart）
# 对应原用例：TC-FILE-001（上传单个文件）
# 运行：hrun examples/unifsp/file_upload.yml
# ============================================================
config:
    name: 上传文件
    base_url: ${api_base()}
    verify: false
    variables:
        app_path: ${app_path()}
        test_dir: ${test_dir()}
    oauth2:
        token_url: ${token_url()}
        client_id: ${ENV(UNIFSP_CLIENT_ID)}
        client_secret: ${ENV(UNIFSP_CLIENT_SECRET)}

teststeps:
  - name: 创建测试目录
    request:
        url: /api/directory/create
        method: POST
        x_path: $app_path
        json:
            path: $test_dir
    validate:
        - eq: [body.success, true]

  - name: 上传文件
    request:
        url: /api/file/upload
        method: POST
        x_path: $test_dir
        upload:
            path: $test_dir                  # 表单字段：目标目录
            files: test_files/测试文件.txt     # 文件字段：中文文件名
    validate:
        - eq: [body.success, true]
        # 成功时响应 data.success 为成功上传的文件名列表，可按需追加断言：
        # - contains: [body.data.success, 测试文件.txt]
