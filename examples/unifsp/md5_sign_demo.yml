# ============================================================
# MD5 签名用法演示（教学示例）
#
# 目的：演示如何在 YAML 里用 ${md5_sign(...)} 生成签名并注入请求。
# 说明：当前 UniFSP 接口只用 OAuth2 Bearer + X-Path，【不需要】签名；
#       本用例是「企业通用签名」的写法示范，供接入需要签名的接口时参考。
#       请求里的 timestamp/sign 参数与 X-Timestamp/X-Sign 头仅作演示，
#       UniFSP 会忽略这些多余字段，不影响查询结果。
#
# 运行：hrun examples/unifsp/md5_sign_demo.yml
# ============================================================
config:
    name: MD5 签名用法演示
    base_url: ${api_base()}
    verify: false
    variables:
        app_path: ${app_path()}
        timestamp: ${get_timestamp()}
        # 签名秘钥（从环境变量读；也可直接写字面量，如 "my-secret"）
        sign_secret: ${ENV(UNIFSP_CLIENT_SECRET)}
        # 参与签名的业务参数（字典；md5_sign 会按 key 升序拼接）
        sign_params:
            path: $app_path
            timestamp: $timestamp
        # 签名 = md5(参数字典按 key 升序拼接 + 秘钥)
        sign: ${md5_sign($sign_params, $sign_secret)}
    oauth2:
        token_url: ${token_url()}
        client_id: ${ENV(UNIFSP_CLIENT_ID)}
        client_secret: ${ENV(UNIFSP_CLIENT_SECRET)}

teststeps:
  - name: 带签名查询目录（只读，签名仅作演示）
    request:
        url: /api/directory/query
        method: GET
        x_path: $app_path
        params:
            path: $app_path
            timestamp: $timestamp
            sign: $sign
        headers:
            X-Timestamp: $timestamp
            X-Sign: $sign
    validate:
        - eq: [body.success, true]
